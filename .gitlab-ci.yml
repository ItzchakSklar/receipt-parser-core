stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PNPM_HOME: "$CI_PROJECT_DIR/.cache/pnpm"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  # Docker-in-Docker, TLS mode (see https://docs.gitlab.com/ci/docker/using_docker_build)
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

# ---------- test ----------

test:backend:
  stage: test
  image: python:3.11-slim
  cache:
    key: "backend-pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends tesseract-ocr > /dev/null
    - cd backend
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
  script:
    - ruff check .
    - ruff format --check .
    - pytest -v
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

test:frontend:
  stage: test
  image: node:22-alpine
  cache:
    key: "frontend-pnpm-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pnpm
  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    # `pnpm lint` is skipped here: this repo currently has no eslint.config.js and
    # several pre-existing lint errors unrelated to CI setup - fix those separately
    # before wiring lint into the pipeline. Typecheck alone still catches real bugs.
    - pnpm exec tsc -b
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

# ---------- build ----------

.build_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build:backend:
  extends: .build_image
  script:
    - docker build -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$BACKEND_IMAGE:latest" backend
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_IMAGE:latest"

build:frontend:
  extends: .build_image
  script:
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$FRONTEND_IMAGE:latest" frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"

# ---------- deploy ----------

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Ship the compose file itself so the server never needs a full repo checkout;
    # the server only needs docker + docker compose installed once beforehand, plus
    # a "~/smartreceipt/.env" holding SECRET_KEY/CORS_ORIGINS/etc (see .env.example).
    - rsync -az docker-compose.yml "$SERVER_USER@$SERVER_IP:~/smartreceipt/docker-compose.yml"
    - >
      ssh "$SERVER_USER@$SERVER_IP"
      "cd ~/smartreceipt &&
      echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY &&
      CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE TAG=$CI_COMMIT_SHORT_SHA docker compose pull &&
      CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE TAG=$CI_COMMIT_SHORT_SHA docker compose up -d &&
      docker image prune -f"
  environment:
    name: production
    url: http://$SERVER_IP
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
