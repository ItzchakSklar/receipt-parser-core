services:
  backend:
    build:
      context: ./backend
    image: ${IMAGE_BASE:-smartreceipt}/backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/smartreceipt.db
      UPLOAD_DIR: /data/uploads
      SENT_EMAIL_DIR: /data/sent_emails
      SECRET_KEY: ${SECRET_KEY:-change-this-super-secret-key-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-reports@smartreceipt.local}
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    image: ${IMAGE_BASE:-smartreceipt}/frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend_data:
