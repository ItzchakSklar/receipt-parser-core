services:
  backend:
    build:
      context: ./backend
    image: ${IMAGE_BASE:-smartreceipt}/backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env - see README "Database (Turso)"}
      SECRET_KEY: ${SECRET_KEY:-change-this-super-secret-key-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    image: ${IMAGE_BASE:-smartreceipt}/frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
